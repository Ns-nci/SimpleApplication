version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.0

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm install

      - run:
          name: Verify application starts
          command: |
            node -v
            npm -v

workflows:
  version: 2
  build_and_test:
    jobs:
      - build