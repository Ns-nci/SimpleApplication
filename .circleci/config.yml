version: 2.1

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build:
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main



# Define the jobs we want to run for this project
jobs:
  build:
    working_directory: ~/SimpleApplication
    docker:
      - image: circleci/node:18.0
    steps:
      - checkout
      - run: 
          name: update-npm
          command: 'sudo npm install -g npm@8.1.4'
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm
          command: npm install       
      - run:
          name: test-run
          command: npm run test
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modulees
  deploy:
    docker:
      - image: circleci/node:18.0
    steps:
    - checkout
    
    - run:
          name: deploy-application
          command:  ssh -i "simpleapp-key.pem" ubuntu@ec2-100-31-135-43.compute-1.amazonaws.com "
            cd SimpleApplication &&
            git pull origin main &&
            npm install &&
            pm2 restart all
            "
    